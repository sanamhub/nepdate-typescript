version: 2
updates:
  # Keeps the pinned action SHAs current. The cooldown gives a bad release a week to be pulled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  # Dev tools only: neither package has runtime dependencies (ADR-0001 §1).
  - package-ecosystem: npm
    directories: ["/", "/bench"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # vitest and its plugins only install at one shared version, so a lone bump fails npm ci.
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
    # A new @types/node major types APIs that engines (>=22.12) doesn't promise; it's picked by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
