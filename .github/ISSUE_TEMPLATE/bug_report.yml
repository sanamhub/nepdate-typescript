name: Bug report
description: A package returns a wrong result or throws an unexpected error.
labels: ["bug"]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The call and its arguments, as a short TypeScript or JavaScript snippet.
      placeholder: NepaliDate.parse("2081-04-32")
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: The result, or the error kind and message.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package versions
      placeholder: nepdate 0.1.0-beta.1, nepdate-patro 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node, Deno, Bun or a browser, with its version.
      placeholder: Node 24.19.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and time zone
      placeholder: Windows 11, Asia/Kathmandu
    validations:
      required: true
