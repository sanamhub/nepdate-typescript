name: release

# One tag vX.Y.Z releases both packages with the same version (ADR-0005). A manual dispatch only
# packs and checks the tarballs: publishing needs a tag push and the production environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack both packages and skip publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Keep workflow_dispatch a dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run != true
        run: |
          echo "workflow_dispatch only packs; push a vX.Y.Z tag to publish" >&2
          exit 1
      - name: Install
        run: npm ci
      - name: Run every gate
        run: npm run ci
      - name: Read and validate the version
        id: version
        run: node scripts/release-version.ts >> "$GITHUB_OUTPUT"
      - name: Check the manifests and the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-check.ts "$VERSION"
      - name: Data status
        # Fails a release with fewer than 183 days of public holiday data left.
        run: node scripts/data-status.ts
      - name: Build
        run: npm run build
      - name: Pack both packages
        run: |
          mkdir -p release-tarballs
          npm pack -w nepdate --pack-destination release-tarballs
          npm pack -w nepdate-patro --pack-destination release-tarballs
      - name: Check the tarball contents and write SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          node scripts/tarball-check.ts
          --version "$VERSION"
          --dir release-tarballs
          --sums release-tarballs/SHA256SUMS
      - name: Check both tarballs
        run: |
          for tarball in release-tarballs/*.tgz; do
            npx publint "$tarball"
            npx attw "$tarball" --profile esm-only
          done
      - name: Upload the tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: release-tarballs/
          if-no-files-found: error
          retention-days: 7

  # ADR-0005 smoke job: install the packed tarballs in two clean projects and run the README
  # examples. No registry login, no secrets; the tarballs come from the pack job.
  smoke:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Core only, from the README
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          mkdir smoke-core
          cd smoke-core
          npm init -y >/dev/null
          npm install --no-audit --no-fund "../release-tarballs/nepdate-$VERSION.tgz"
          node ../scripts/smoke.ts --mode core --project "$PWD"
      - name: Core plus patro, from the README
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          mkdir smoke-patro
          cd smoke-patro
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "../release-tarballs/nepdate-$VERSION.tgz" \
            "../release-tarballs/nepdate-patro-$VERSION.tgz"
          node ../scripts/smoke.ts --mode patro --project "$PWD"

  # Mutation testing (ADR-0007). The release is blocked when the score is below the floor or a
  # survivor has no equivalent entry. It needs pack, runs beside the smoke job, and gates publish.
  mutation:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Run mutation testing
        run: npm run mutation:force
      - name: Check the floor and the equivalent list
        run: npm run mutation:check

  publish:
    needs: [pack, smoke, mutation]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag commit is on origin/main
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release: not a full commit SHA: $COMMIT_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "release: $COMMIT_SHA is not on origin/main" >&2
            exit 1
          fi
      - name: Download the tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Read and validate the version
        id: version
        run: node scripts/release-version.ts >> "$GITHUB_OUTPUT"
      - name: Check the manifests and the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-check.ts "$VERSION"
      - name: Verify the checked tarballs
        run: cd release-tarballs && sha256sum -c SHA256SUMS
      - name: Publish nepdate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
          fi
          if npm view "nepdate@$VERSION" version >/dev/null 2>&1; then
            echo "nepdate@$VERSION is already on npm"
          else
            npm publish "release-tarballs/nepdate-$VERSION.tgz" --provenance --access public
          fi
      - name: Publish nepdate-patro
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
          fi
          if npm view "nepdate-patro@$VERSION" version >/dev/null 2>&1; then
            echo "nepdate-patro@$VERSION is already on npm"
          else
            npm publish "release-tarballs/nepdate-patro-$VERSION.tgz" --provenance --access public
          fi

  # Post-publish verification (ADR-0011): install both exact versions from the public registry and
  # run the README quick start plus one info() call. No secret, no id-token, no checkout.
  verify:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the published packages with retries
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify-packages"
          cd "$RUNNER_TEMP/verify-packages"
          npm init -y >/dev/null
          deadline=$((SECONDS + 600))
          while true; do
            if npm install --no-audit --no-fund "nepdate@$VERSION" "nepdate-patro@$VERSION"; then
              break
            fi
            now=$SECONDS
            if [ "$now" -ge "$deadline" ]; then
              echo "verify: install failed after 10 minutes" >&2
              exit 1
            fi
            pause=$((deadline - now))
            if [ "$pause" -gt 30 ]; then pause=30; fi
            echo "verify: install failed, retrying in ${pause}s" >&2
            sleep "$pause"
          done
      - name: Run the README quick start and one info() call
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verify-packages"
          node --input-type=module - <<'JS'
          import { NepaliDate } from "nepdate";
          import { info } from "nepdate-patro";

          const date = NepaliDate.of(2081, 2, 15);
          const gregorian = date.toGregorian();
          if (gregorian.year !== 2024 || gregorian.month !== 5 || gregorian.day !== 28) {
            throw new Error(`verify: toGregorian returned ${JSON.stringify(gregorian)}`);
          }
          if (date.toJSON() !== "2081-02-15") {
            throw new Error(`verify: toJSON returned ${date.toJSON()}`);
          }
          if (date.long({ weekday: true }) !== "Tuesday, Jestha 15, 2081") {
            throw new Error(`verify: long returned ${date.long({ weekday: true })}`);
          }
          const day = info(date);
          if (!day.isPublicHoliday || day.events[0]?.en !== "Republic Day") {
            throw new Error("verify: info did not return Republic Day");
          }
          console.log("verify: README quick start and one patro lookup passed");
          JS

  # The GitHub release appears only after verify has installed both versions from the registry, so a
  # failed verify leaves no release page for packages that are about to be deprecated (ADR-0011).
  # This is the only job with contents: write; it publishes nothing to npm.
  github-release:
    needs: [publish, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Verify the checked tarballs
        run: cd release-tarballs && sha256sum -c SHA256SUMS
      - name: Create the GitHub release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          node -e 'const fs = require("node:fs"); const version = process.env.VERSION; const text = fs.readFileSync("CHANGELOG.md", "utf8"); const start = text.indexOf("## [" + version + "]"); if (start < 0) { console.error("no changelog section for " + version); process.exit(1); } const rest = text.slice(start); const next = rest.indexOf("\n## [", 3); fs.writeFileSync("RELEASE_NOTES.md", (next < 0 ? rest : rest.slice(0, next)).trim() + "\n");'
          gh release create "v$VERSION" release-tarballs/*.tgz --title "v$VERSION" --notes-file RELEASE_NOTES.md --verify-tag
