name: release

# One tag vX.Y.Z or vX.Y.Z-PRERELEASE releases both packages with the same version (ADR-0005). A
# manual dispatch only packs and checks the tarballs: publishing needs a tag push and the
# production environment. A pre-release goes to its own npm dist-tag, never to latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack both packages and skip publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Keep workflow_dispatch a dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run != true
        run: |
          echo "workflow_dispatch only packs; push a vX.Y.Z tag to publish" >&2
          exit 1
      - name: Install
        run: npm ci
      - name: Run every gate
        run: npm run ci
      - name: Read and validate the version
        id: version
        run: node scripts/release-version.ts >> "$GITHUB_OUTPUT"
      - name: Check the manifests and the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-check.ts "$VERSION"
      - name: Data status
        # Fails a release with fewer than 183 days of public holiday data left.
        run: node scripts/data-status.ts
      - name: Build
        run: npm run build
      - name: Pack both packages
        run: |
          mkdir -p release-tarballs
          npm pack -w nepdate --pack-destination release-tarballs
          npm pack -w nepdate-patro --pack-destination release-tarballs
      - name: Check the tarball contents and write SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          node scripts/tarball-check.ts
          --version "$VERSION"
          --dir release-tarballs
          --sums release-tarballs/SHA256SUMS
      - name: Check both tarballs
        run: |
          for tarball in release-tarballs/*.tgz; do
            npx publint "$tarball"
            npx attw "$tarball" --profile esm-only
          done
      - name: Upload the tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarballs
          path: release-tarballs/
          if-no-files-found: error
          retention-days: 7

  # ADR-0005 smoke job: install the packed tarballs in two clean projects and run the README
  # examples. No registry login, no secrets; the tarballs come from the pack job.
  smoke:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Core only, from the README
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          mkdir smoke-core
          cd smoke-core
          npm init -y >/dev/null
          npm install --no-audit --no-fund "../release-tarballs/nepdate-$VERSION.tgz"
          node ../scripts/smoke.ts --mode core --project "$PWD"
      - name: Core plus patro, from the README
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          mkdir smoke-patro
          cd smoke-patro
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "../release-tarballs/nepdate-$VERSION.tgz" \
            "../release-tarballs/nepdate-patro-$VERSION.tgz"
          node ../scripts/smoke.ts --mode patro --project "$PWD"

  # Mutation testing (ADR-0007). The release is blocked when the score is below the floor or a
  # survivor has no equivalent entry. It needs pack, runs beside the smoke job, and gates publish.
  mutation:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Run mutation testing
        run: npm run mutation:force
      - name: Check the floor and the equivalent list
        run: npm run mutation:check

  publish:
    needs: [pack, smoke, mutation]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag commit is on origin/main
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release: not a full commit SHA: $COMMIT_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "release: $COMMIT_SHA is not on origin/main" >&2
            exit 1
          fi
      - name: Download the tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Read and validate the version
        id: version
        run: node scripts/release-version.ts >> "$GITHUB_OUTPUT"
      - name: Check the manifests and the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-check.ts "$VERSION"
      - name: Verify the checked tarballs
        run: cd release-tarballs && sha256sum -c SHA256SUMS
      # --tag is not optional: npm points latest at anything published without it, so a beta
      # would become what `npm install nepdate` installs. release-version.ts gives a stable version
      # latest and a pre-release its own tag (beta for 0.1.0-beta.1).
      - name: Publish nepdate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
          fi
          if npm view "nepdate@$VERSION" version >/dev/null 2>&1; then
            echo "nepdate@$VERSION is already on npm"
          else
            npm publish "release-tarballs/nepdate-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"
          fi
      - name: Publish nepdate-patro
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
          fi
          if npm view "nepdate-patro@$VERSION" version >/dev/null 2>&1; then
            echo "nepdate-patro@$VERSION is already on npm"
          else
            npm publish "release-tarballs/nepdate-patro-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"
          fi

  # Post-publish verification (ADR-0011): verify-published.yml installs both exact versions from the
  # public registry on Linux, macOS and Windows with Node 22 and 24, checks the registry signatures
  # and runs the README quick start plus one info() call. Called, not triggered: a release created
  # with GITHUB_TOKEN fires no event. It can also be dispatched by hand for any published version.
  verify:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.publish.outputs.version }}

  # The GitHub release appears only after verify has installed both versions from the registry, so a
  # failed verify leaves no release page for packages that are about to be deprecated (ADR-0011).
  # This is the only job with contents: write; it publishes nothing to npm.
  github-release:
    needs: [publish, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Verify the checked tarballs
        run: cd release-tarballs && sha256sum -c SHA256SUMS
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Notes come from the CHANGELOG section plus install and verification blocks, not from the
      # commit log. A pre-release version becomes a GitHub pre-release, so it is never shown as
      # the latest release.
      - name: Create the GitHub release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.ts "$VERSION" > RELEASE_NOTES.md
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" release-tarballs/*.tgz --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md --verify-tag "${prerelease[@]}"
