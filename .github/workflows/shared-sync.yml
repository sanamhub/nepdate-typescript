# Weekly: replaces shared/ with the hub's main, regenerates the tables and opens one PR
# (ADR-0001 §7).
name: shared-sync

on:
  schedule:
    - cron: "15 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: sanamhub/nepdate/.github/workflows/shared-sync.yml@f86f9e5feb9bb9fba46ee477b34d7b42ddd30910 # main 2026-10-10
    with:
      regenerate: npm ci && npm run codegen
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
