name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run ci

  # The edge functions (fromJSDate, toJSDate, today) must give the same core results in every zone
  # (ADR-0004). Kiritimati is UTC+14, the far side of the date line from Los Angeles.
  time-zones:
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Los_Angeles, Asia/Kathmandu, Pacific/Kiritimati]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Imports both built packages in each runtime the packages support (ADR-0001 §3).
  runtimes:
    strategy:
      fail-fast: false
      matrix:
        runtime: [node22, node24, deno, bun]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'node22'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12
      - if: matrix.runtime == 'node22' || matrix.runtime == 'node24'
        run: node --input-type=module -e "await import('nepdate'); await import('nepdate-patro')"
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno eval "await import('./packages/nepdate/dist/index.js'); await import('./packages/nepdate-patro/dist/index.js')"
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.runtime == 'bun'
        run: bun -e "await import('./packages/nepdate/dist/index.js'); await import('./packages/nepdate-patro/dist/index.js')"

  # Browser smoke test (ADR-0004): imports both built packages in Chromium through Vitest browser mode.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser -w nepdate-patro

  shared-check:
    permissions:
      contents: read
    uses: sanamhub/nepdate/.github/workflows/shared-check.yml@f86f9e5feb9bb9fba46ee477b34d7b42ddd30910 # main 2026-10-10
