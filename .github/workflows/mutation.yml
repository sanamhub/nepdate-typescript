name: mutation

# ADR-0019: the weekly run catches test rot, and a pull request that changes the library, its tests
# or the triage files runs the same gate, so a survivor is caught in review instead of at the tag.
on:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "packages/nepdate/src/**"
      - "packages/nepdate-patro/src/**"
      - "packages/nepdate/test/**"
      - "packages/nepdate-patro/test/**"
      - "packages/*/vitest.stryker.config.ts"
      - "stryker*.mjs"
      - "scripts/mutation-check.ts"
      - "scripts/mutation-summary.ts"
      - "docs/mutation/**"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same zone as the release job: the floor and the equivalent list were measured under Nepal
    # time, and on a UTC runner mutants that swap the local and UTC Date constructors survive.
    env:
      TZ: Asia/Kathmandu
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Run mutation testing
        run: npm run mutation:force
      - name: Check the floor and the equivalent list
        run: npm run mutation:check
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: reports/mutation/*.json
          if-no-files-found: warn
          retention-days: 30
